name: 🔬 Compile + XXL Unit Tests

# Быстрый гейт: компилирует Java/Kotlin слой TMessagesProj и гоняет честные JVM-тесты
# крысы (uz.unnarsx.cherrygram.xxl.**). Native (ffmpeg/td/libvpx) здесь не строится,
# но два подмодуля всё равно обязательны: settings.gradle:18 делает
# `apply from: file("TMessagesProj_Modules/media/core_settings.gradle")`, а :jlatexmath —
# project-зависимость TMessagesProj (build.gradle:147). Без них Gradle падает на конфигурации.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: compile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    name: javac + kotlinc + junit
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Освобождаем диск
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Подмодули, обязательные для конфигурации
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive \
            TMessagesProj_Modules/media TMessagesProj/lib/jlatexmath
          ls TMessagesProj_Modules/media/core_settings.gradle
          ls TMessagesProj/lib/jlatexmath/jlatexmath

      - name: JDK 17 (ровно как в Dockerfile репозитория)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 36 + build-tools 36.0.0
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Файлы, без которых конфигурация Gradle падает
        run: |
          # gradlew лежит в git как 100644 (без exec-бита) -> "./gradlew: Permission denied", exit 126
          chmod +x gradlew
          # App*/build.gradle читает secrets_for_ci.env на этапе конфигурации (Files.lines без try/catch)
          cp -f secrets_for_ci.env.example secrets_for_ci.env
          # signingConfigs указывают на ../Your_Key.jks с placeholder-паролями
          keytool -genkeypair -v \
            -keystore Your_Key.jks \
            -alias Your_Alias \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass Your_Password -keypass Your_Password \
            -dname "CN=CherrygramXXL, OU=XXL, O=XXL, C=RU"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
          # Родной gradle-wrapper.jar из «Initial Release» (sha256 e2b82129...) отсутствует
          # в списке официальных чексумм Gradle, а setup-gradle с v4 валидирует его молча
          # и валит джобу до компиляции. См. gradle/actions/docs/setup-gradle.md#gradle-wrapper-validation
          validate-wrappers: false

      - name: Tune Gradle
        run: |
          mkdir -p ~/.gradle
          {
            echo 'org.gradle.caching=true'
            echo 'kotlin.daemon.jvmargs=-Xmx3g'
            echo 'android.native.buildOutput=quiet'
          } >> ~/.gradle/gradle.properties
          cat ~/.gradle/gradle.properties

      - name: Compile Android-слой (все 10 крысиных коммитов проходят здесь)
        run: |
          ./gradlew --no-daemon --parallel --max-workers=3 \
            -Dorg.gradle.jvmargs=-Xmx6g \
            :TMessagesProj:compileDebugKotlin \
            :TMessagesProj:compileDebugJavaWithJavac \
            --stacktrace

      - name: Честные unit-тесты ядра крысы (AGENTS.md §4)
        run: |
          ./gradlew --no-daemon --parallel --max-workers=3 \
            -Dorg.gradle.jvmargs=-Xmx6g \
            :TMessagesProj:testDebugUnitTest \
            --tests "uz.unnarsx.cherrygram.xxl.*" \
            --stacktrace

      - name: Отчёты тестов, если крыса упала
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: TMessagesProj/build/reports/tests/**
          if-no-files-found: ignore
          compression-level: 0
