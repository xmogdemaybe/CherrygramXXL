name: 🚀✨ Build XXL APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "debug = быстрый без R8, standalone = релиз с минификацией"
        type: choice
        required: true
        default: debug
        options:
          - debug
          - standalone
  push:
    tags:
      - 'v*'
      - 'xxl*'

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: afat ${{ github.event.inputs.build_type || 'debug' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}

    steps:
      - name: Освобождаем диск, но НЕ трогаем NDK нужной версии
        run: |
          sudo rm -rf /usr/share/dotnet /opt/hostedtoolcache/CodeQL || true
          # Раньше здесь был rm -rf "$ANDROID_HOME"/ndk/* — то есть мы удаляли готовый NDK
          # из образа и затем скачивали его же заново (~2 минуты и ~1 ГБ трафика).
          for d in "$ANDROID_HOME"/ndk/*; do
            case "$d" in
              *27.2.12479018) ;;
              *) sudo rm -rf "$d" ;;
            esac
          done
          sudo rm -rf "$ANDROID_HOME"/platforms/android-3* || true
          sudo rm -rf "$ANDROID_HOME"/system-images "$ANDROID_HOME"/sources "$ANDROID_HOME"/sources/* || true
          df -h /
          ls "$ANDROID_HOME"/ndk 2>/dev/null || echo "NDK в образе не найден -> скачаем"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ключ кэша подмодулей (SHA гитлинков + .gitmodules)
        id: subkey
        run: |
          git submodule sync --recursive > /dev/null
          HASH="$( { git config --file .gitmodules --get-regexp path; git submodule status; } | sha256sum | cut -c1-64 )"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "submodules key: $HASH"

      - name: Кэш подмодулей JNI
        id: subcache
        uses: actions/cache@v4
        with:
          path: |
            .git/modules
            TMessagesProj/jni/tlottie
            TMessagesProj/jni/td
            TMessagesProj/jni/tgcalls
            TMessagesProj/jni/wallet-engine
            TMessagesProj/jni/third_party/ffmpeg
            TMessagesProj/jni/third_party/libvpx
            TMessagesProj/jni/third_party/dav1d
            TMessagesProj/jni/third_party/libyuv
            TMessagesProj/jni/third_party/openh264
            TMessagesProj/jni/third_party/boringssl
            TMessagesProj/jni/third_party/absl
            TMessagesProj/jni/third_party/wamr
            TMessagesProj/jni/third_party/boost-regex
            TMessagesProj/jni/third_party/libprisma
            TMessagesProj/jni/third_party/xiph/ogg
            TMessagesProj/jni/third_party/xiph/opus
            TMessagesProj/jni/third_party/xiph/opusfile
            TMessagesProj/lib/jlatexmath
            TMessagesProj_Modules/media
          key: submodules-${{ steps.subkey.outputs.hash }}
          # actions/cache по умолчанию НЕ трогает пути с точкой, а без .git/modules
          # восстановленные подмодули останутся с висячими .git-файлами.
          include-hidden-files: true

      - name: Подмодули JNI (ffmpeg / libvpx / td / tlottie / jlatexmath / media3)
        if: steps.subcache.outputs.cache-hit != 'true'
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --jobs 8

      - name: Проверка, что подмодули на месте (кэш или клон)
        run: |
          ls TMessagesProj/jni/third_party/ffmpeg/libavcodec/avcodec.h
          ls TMessagesProj/jni/td/CMakeLists.txt
          ls TMessagesProj_Modules/media/core_settings.gradle
          ls TMessagesProj/lib/jlatexmath/jlatexmath
          du -sh TMessagesProj/jni TMessagesProj/lib 2>/dev/null || true
          df -h /

      - name: JDK 17 (ровно как в Dockerfile репозитория)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 36 + NDK 27.2.12479018 + CMake 3.22.1
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.2.12479018"

      - name: Файлы, без которых конфигурация Gradle падает
        run: |
          # gradlew лежит в git как 100644 (без exec-бита) -> "./gradlew: Permission denied", exit 126
          chmod +x gradlew
          # App*/build.gradle читает secrets_for_ci.env на этапе конфигурации (Files.lines без try/catch)
          cp -f secrets_for_ci.env.example secrets_for_ci.env
          # signingConfigs указывают на ../Your_Key.jks с placeholder-паролями из TMessagesProj_AppStandalone/build.gradle
          keytool -genkeypair -v \
            -keystore Your_Key.jks \
            -alias Your_Alias \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass Your_Password -keypass Your_Password \
            -dname "CN=CherrygramXXL, OU=XXL, O=XXL, C=RU"

      - name: Ключ кэша native-объектов
        id: cxxkey
        run: |
          # Меняется хоть один C++-файл/CMakeLists/gradle-конфиг/ABI/NDK/бит билд-тайпа —
          # ключ другой, и ninja честно пересобирает. НЕ включаем сюда хеш этого workflow-файла:
          # иначе опечатка в комментарии сбрасывала бы кэш всего C++-слоя.
          JNI_TREE="$(git rev-parse HEAD:TMessagesProj/jni)"
          GRADLE_SHORT="$(git rev-parse HEAD:TMessagesProj/build.gradle HEAD:TMessagesProj_AppStandalone/build.gradle | tr -d '\n' | cut -c1-16)"
          # Ключ оставляем ЧИТАЕМЫМ: тогда restore-keys "cxx-<type>-arm64-ndk..." реально
          # подтягивает предыдущее состояние, а не висит декорацией (ключ-хеш не совпал бы никогда).
          KEY="cxx-${BUILD_TYPE}-arm64-v8a-ndk27.2.12479018-${SUBKEY:0:12}-${GRADLE_SHORT}-${JNI_TREE}"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "native key: $KEY"
        env:
          SUBKEY: ${{ steps.subkey.outputs.hash }}

      - name: Кэш native-объектов (.cxx + intermediates/cxx)
        id: cxxcache
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/.cxx
            TMessagesProj/build/cxx
            TMessagesProj/build/intermediates/cxx
          key: ${{ steps.cxxkey.outputs.key }}
          restore-keys: |
            cxx-${{ env.BUILD_TYPE }}-arm64-v8a-ndk27.2.12479018-

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          # Пишем, а не только читаем: иначе org.gradle.caching=true собирает build-cache
          # в пустоту и каждый прогон заново компилирует Kotlin/Java-слой.
          cache-read-only: false
          # Тот же gradle-wrapper.jar что в compile-check: родной для Telegram/Cherrygram,
          # не совпадает ни с одной официальной чексуммой Gradle -> валидация валит джобу.
          validate-wrappers: false

      - name: Tune Gradle
        run: |
          mkdir -p ~/.gradle
          {
            echo 'org.gradle.caching=true'
            echo 'kotlin.daemon.jvmargs=-Xmx3g'
            echo 'android.native.buildOutput=verbose'
          } >> ~/.gradle/gradle.properties
          free -m
          nproc

      - name: Assemble APK
        run: |
          if [ "$BUILD_TYPE" = "debug" ]; then
            TASK=assembleAfatDebug
          else
            TASK=assembleAfatStandalone
          fi
          echo "task = :TMessagesProj_AppStandalone:$TASK  (build_type=$BUILD_TYPE)"
          # Флейвор afat тащит сразу armeabi-v7a + arm64-v8a (splits.abi в build.gradle модуля),
          # поэтому ninja гоняет NDK дважды — это самая долгая часть пайплайна.
          ( while sleep 60; do printf '[mem] %s\n' "$(free -m | awk 'NR==2{printf "%s/%s MB", $3, $2}')"; done ) &
          MON=$!
          status=0
          ./gradlew --no-daemon --parallel --max-workers=3 \
            -Dorg.gradle.jvmargs=-Xmx6g \
            :TMessagesProj_AppStandalone:"$TASK" --stacktrace || status=$?
          kill "$MON" 2>/dev/null || true
          exit "$status"

      - name: Что получилось
        run: |
          find TMessagesProj_AppStandalone/build/outputs/apk -name '*.apk' -printf '%p  %s bytes\n' | sort

      - name: Артефакт
        uses: actions/upload-artifact@v4
        with:
          name: CherrygramXXL-APK-${{ env.BUILD_TYPE }}
          path: TMessagesProj_AppStandalone/build/outputs/apk/afat/**/*.apk
          if-no-files-found: error
          compression-level: 0
